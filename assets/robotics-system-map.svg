<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e8edf3" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

  <text x="70" y="58" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">INTELLIGENT ROBOTIC SYSTEMS</text>
  <text x="70" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">The areas I'm exploring and how they connect.</text>

  <!-- Main flow -->
  <line x1="600" y1="175" x2="600" y2="215" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="315" x2="600" y2="355" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="455" x2="600" y2="495" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Perception -->
  <rect x="470" y="105" width="260" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2563eb">PERCEPTION</text>
  <text x="600" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Computer Vision  ·  Sensor Fusion</text>

  <!-- Intelligence -->
  <rect x="390" y="215" width="420" height="100" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#10b981">INTELLIGENCE</text>
  <text x="600" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Kinematics &amp; Dynamics  ·  Algorithms</text>
  <text x="600" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">AI / Reinforcement Learning  ·  Planning</text>

  <!-- Simulation / control -->
  <rect x="190" y="355" width="820" height="100" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="600" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f97316">SIMULATION &amp; CONTROL</text>
  <text x="330" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">ROS 2</text>
  <text x="490" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Gazebo</text>
  <text x="650" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Digital Twins</text>
  <text x="820" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Embedded Control</text>
  <text x="600" y="437" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Motion · Actuation · Robot Simulation</text>

  <!-- Hardware -->
  <rect x="470" y="495" width="260" height="50" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7c3aed">ROBOT HARDWARE</text>
</svg>
